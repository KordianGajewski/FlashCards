vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:true}
spring.application.name=FlashCards
spring.data.rest.base-path=/api

# --- Baza danych (zmienne ?rodowiskowe lub lokalne warto?ci) ---
# Lokalnie: jdbc:mysql://localhost:3306/cards
# TiDB Cloud: jdbc:mysql://HOST:4000/BAZA?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cards}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:6666}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=never

# --- Connection Pool (HikariCP) - wa?ne dla TiDB Cloud ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

# --- Vaadin ---
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:false}
vaadin.frontend.hotdeploy=false
vaadin.featureflags.co-pilot.enabled=false
vaadin.featureflags.com.vaadin.copilot.enabled=false

# --- Security (admin in-memory - nie potrzebne, bo admin jest w SecurityConfig) ---
# Usuni?to spring.security.user.* - admin jest zarz?dzany w SecurityConfig i CommandLineRunner

# --- API ---
wordnik.api.key=${WORDNIK_API_KEY:TWOJ_KLUCZ_API}

# --- Serwer (Render.com ustawia PORT) ---
server.port=${PORT:8080}
