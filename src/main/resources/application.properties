vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:true}
spring.application.name=FlashCards
spring.data.rest.base-path=/api

# --- Baza danych (zmienne srodowiskowe lub lokalne wartosci) ---
# Lokalnie: jdbc:mysql://localhost:3306/cards?createDatabaseIfNotExist=true
# TiDB Cloud: jdbc:mysql://TWOJ_HOST:4000/flashcards?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true
# WAZNE: URL musi zawierac nazwe bazy danych po porcie (np. /flashcards)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cards?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:6666}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Connection Pool (HikariCP) - dla TiDB Cloud ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

# --- Vaadin ---
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:false}
vaadin.frontend.hotdeploy=${VAADIN_HOTDEPLOY:true}
vaadin.featureflags.co-pilot.enabled=false
vaadin.featureflags.com.vaadin.copilot.enabled=false

# --- Serwer (Render.com domyslnie oczekuje portu 10000) ---
server.port=${PORT:10000}

# --- Sesja / ciasteczko ---
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.max-age=604800

